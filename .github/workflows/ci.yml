
name: My Portfolio CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check HTML file exists
        run: test -f index.html

      - name: Validate HTML
        run: npx --yes html-validate index.html

      - name: Print success message
        run: echo "HTML validation completed successfully!"
